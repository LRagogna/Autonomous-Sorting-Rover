# This file tells YOLO where the pictures are and what the classes are.
# 'path' is an absolute folder so training works no matter which folder
# the training command is run from. It is rewritten every time you
# process data, so it stays correct after moving the repo.
path: /Users/leonardoragogna/Desktop/AutonomousRover/data/labels
train:
  - bit/images/train
  - wrench/images/train
val:
  - bit/images/val
  - wrench/images/val
nc: 2
names:
  0: bit
  1: wrench
