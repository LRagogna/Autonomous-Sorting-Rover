<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rover Training Control Center</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">◎</div>
      <div>
        <h1>Rover Training Control Center</h1>
        <p class="sub" id="projectName">Loading…</p>
      </div>
    </div>
    <div class="job-indicator" id="jobIndicator">
      <span class="dot" id="jobDot"></span>
      <span id="jobStatus">Idle</span>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="card" id="sbProject"></div>
      <div class="card">
        <h3>Dataset</h3>
        <div id="sbClasses" class="class-stats"></div>
      </div>
      <div class="card">
        <h3>Pipeline</h3>
        <ol id="sbChecklist" class="checklist"></ol>
      </div>
    </aside>

    <main class="content">
      <nav class="tabnav" id="tabNav"></nav>
      <div class="panels" id="tabPanels"></div>

      <section class="joblog" id="jobStrip" hidden>
        <div class="joblog-head">
          <div class="joblog-title">
            <span class="dot" id="stripDot"></span>
            <strong id="stripKind">Job</strong>
            <span id="stripStatus" class="muted"></span>
          </div>
          <div class="joblog-actions">
            <div class="progress" id="stripProgress" hidden><div class="progress-bar" id="stripBar"></div></div>
            <button class="btn ghost" id="stripJump">Jump to latest</button>
            <button class="btn ghost" id="stripClose">Hide</button>
          </div>
        </div>
        <pre id="jobLog" class="log">No job has run yet.</pre>
        <div id="jobSummary" class="job-summary" hidden></div>
      </section>
    </main>
  </div>

  <!-- Reusable video preview modal -->
  <div id="videoModal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span id="videoTitle" class="modal-title"></span>
        <button class="btn ghost" id="videoClose">Close</button>
      </div>
      <video id="videoPlayer" controls preload="metadata"></video>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
  <script src="/tabs/upload.js"></script>
  <script src="/tabs/process.js"></script>
  <script src="/tabs/review.js"></script>
  <script src="/tabs/train.js"></script>
  <script>window.App && window.App.init();</script>
</body>
</html>
